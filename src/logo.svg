<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-labelledby="logoTitle" role="img">
<title id="logoTitle">Folder Sunburst Explorer Logo - Detailed Stacked Colors v2</title>
  <defs>
    <!-- Define colors based on the NEW screenshot inspiration -->
    <color id="salmon">#FB8585</color>  <!-- Approx Salmon/Rose -->
    <color id="teal">#7DD3FC</color>    <!-- Approx Light Teal/Sky -->
    <color id="orangeYellow">#F59E0B</color> <!-- Approx Orange-Yellow/Amber -->
    <color id="lightTan">#FDE68A</color> <!-- Approx Light Tan/Yellow -->
  </defs>

  <!-- General Styling -->
  <style>
    circle {
      fill: none;
      stroke-width: 8; /* Slightly reduced stroke width for more layers */
      stroke-linecap: butt;
    }
  </style>

  <!-- Add one more inner ring -->
  <!-- Ring Radii -->
  <variable id="r1" value="45"/>
  <variable id="r2" value="37"/>
  <variable id="r3" value="29"/>
  <variable id="r4" value="21"/>
  <variable id="r5" value="13"/>

  <!-- Approximate Angular Sections -->
  <!-- OrangeYellow: ~160 deg (0 to 160) -->
  <!-- Teal: ~90 deg (160 to 250) -->
  <!-- Salmon: ~110 deg (250 to 360) -->

  <!-- Draw Rings with more segments -->
  <g transform="rotate(-90 50 50)">

    <!-- Ring 2 (r=37) -->
    <circle cx="50" cy="50" r="37" stroke="#F59E0B" stroke-dasharray="42.9 232.5" transform="rotate(10 50 50)"/> <!-- OrangeYellow 144 deg -->
    <circle cx="50" cy="50" r="37" stroke="#FDE68A" stroke-dasharray="5.9 232.5" transform="rotate(146 50 50)"/> <!-- Tan 20 deg -->
    <circle cx="50" cy="50" r="37" stroke="#7DD3FC" stroke-dasharray="47.9 232.5" transform="rotate(164 50 50)"/> <!-- Teal 90 deg -->
    <circle cx="50" cy="50" r="37" stroke="#FB8585" stroke-dasharray="28.5 232.5" transform="rotate(254 50 50)"/> <!-- Salmon 106 deg -->

    <!-- Ring 3 (r=29) -->
    <circle cx="50" cy="50" r="29" stroke="#F59E0B" stroke-dasharray="72.7 182.2" transform="rotate(0 50 50)"/> <!-- OrangeYellow 144 deg -->
    <circle cx="50" cy="50" r="29" stroke="#FDE68A" stroke-dasharray="10.1 182.2" transform="rotate(144 50 50)"/> <!-- Tan 20 deg -->
    <circle cx="50" cy="50" r="29" stroke="#7DD3FC" stroke-dasharray="45.5 182.2" transform="rotate(164 50 50)"/> <!-- Teal 90 deg -->
    <circle cx="50" cy="50" r="29" stroke="#FB8585" stroke-dasharray="53.9 182.2" transform="rotate(254 50 50)"/> <!-- Salmon 106 deg -->

    <!-- Ring 4 (r=21) -->
    <circle cx="50" cy="50" r="21" stroke="#F59E0B" stroke-dasharray="52.5 131.9" transform="rotate(0 50 50)"/> <!-- OrangeYellow 144 deg -->
    <circle cx="50" cy="50" r="21" stroke="#FDE68A" stroke-dasharray="7.3 131.9" transform="rotate(144 50 50)"/> <!-- Tan 20 deg -->
    <circle cx="50" cy="50" r="21" stroke="#7DD3FC" stroke-dasharray="33.0 131.9" transform="rotate(164 50 50)"/> <!-- Teal 90 deg -->
    <circle cx="50" cy="50" r="21" stroke="#FB8585" stroke-dasharray="39.1 131.9" transform="rotate(254 50 50)"/> <!-- Salmon 106 deg -->

    <!-- Ring 5 (Innermost, r=13) -->
    <circle cx="50" cy="50" r="13" stroke="#F59E0B" stroke-dasharray="32.4 81.7" transform="rotate(0 50 50)"/> <!-- OrangeYellow 144 deg -->
    <circle cx="50" cy="50" r="13" stroke="#FDE68A" stroke-dasharray="4.5 81.7" transform="rotate(144 50 50)"/> <!-- Tan 20 deg -->
    <circle cx="50" cy="50" r="13" stroke="#7DD3FC" stroke-dasharray="20.4 81.7" transform="rotate(164 50 50)"/> <!-- Teal 90 deg -->
    <circle cx="50" cy="50" r="13" stroke="#FB8585" stroke-dasharray="24.1 81.7" transform="rotate(254 50 50)"/> <!-- Salmon 106 deg -->

  </g>
</svg>
